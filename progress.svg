<svg width="500" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon Blue/Cyan Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background (Blends with GitHub Dark Mode) -->
  <rect width="500" height="60" fill="transparent" />

  <!-- Track (Dark Grey) -->
  <rect x="10" y="30" width="400" height="12" rx="6" fill="#21262d" />

  <!-- Progress Fill with Gradient and Glow -->
  <rect x="10" y="30" width="400.0" height="12" rx="6" fill="url(#neonGlow)" filter="url(#glow)" />

  <!-- Percentage Text -->
  <text x="425" y="41" fill="#c9d1d9" font-family="Courier New, monospace" font-size="16" font-weight="bold">100.0%</text>
  
  <!-- Title Text -->
  <text x="10" y="20" fill="#8b949e" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">OVERALL FOUNDATION PROGRESS</text>
</svg>